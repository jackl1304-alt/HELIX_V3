# Helix Regulatory Intelligence - Production Nginx Configuration
# Designed to run behind Cloudflare proxy (orange cloud) for DDoS/WAF/CDN.
# Cloudflare client IP is exposed via CF-Connecting-IP header.
# Real client IP is restored via real_ip_header CF-Connecting-IP for proper rate limiting and audit logs.

# NOTE: This file is mounted into the nginx container at /etc/nginx/nginx.conf.
# Run-time customization (TLS paths, server name) is injected via envsubst
# in the docker-compose setup if you want environment-driven config.

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DNS resolver for ssl_stapling (Cloudflare OCSP) — required, otherwise TLS startup silently fails
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # --- Cloudflare trusted proxies (IPv4) ---
    # Source: https://www.cloudflare.com/ips-v4 — keep in sync
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.192.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # --- Cloudflare trusted proxies (IPv6) ---
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # --- Security Headers (Cloudflare terminates TLS upstream and forwards HTTP here) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP — strict-by-default in production, application/manifest artifacts whitelisted.
    # 'unsafe-inline' is allowed for now because the React build emits inline style tags;
    # remove once you adopt nonce-based hashing.
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' https: data:; connect-src 'self' https: wss:;" always;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Match Express JSON body limit to avoid silent 413-vs-mangled-body confusion
    client_max_body_size 50M;
    # Real client IPs (post CF) for stable connections
    keepalive_requests 1000;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private must-revalidate proxy-revalidate public;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --- Rate Limiting (real client IP thanks to real_ip_header) ---
    # 10 r/s baseline for any API route, burst 30 for normal traffic
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # 1 r/s for login/auth routes, burst 5
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    # 30 r/s for static assets and pages (gives CF cache edge hosts headroom)
    limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

    # Connection-level limits to defend against slowloris-style abuse
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Log Format with CF-Edge and real-client-IP
    log_format helix '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'cf=$http_cf_connecting_ip '
                     'cf_ray=$http_cf_ray '
                     'cf_country=$http_cf_ipcountry '
                     'rt=$request_time '
                     'uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log helix;
    error_log /var/log/nginx/error.log warn;

    # Upstream Backend — direct docker network reference
    upstream helix_backend {
        server helix-app:5000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream grafana_backend {
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # HTTP → HTTPS Upgrade (Cloudflare forwards either http or https here)
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ----- Main Application Server -----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # Server name is generic; CF routes per host header. Tenant subdomains work out-of-the-box.
        server_name _;

        # TLS (terminated here; if Cloudflare handles TLS, ensure SSL certificate is a Cloudflare Origin Certificate)
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 4h;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS (Cloudflare also adds one — this is the origin-side enforcement)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Hide our nginx version
        server_tokens off;

        # Connection limits
        limit_conn conn 50;

        # ---- API routes ----
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://helix_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $host;
            # Critical: forward the real client IP and CF metadata
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_cache_bypass $http_upgrade;

            # Generous timeouts — AI calls and 90+ source sync jobs can take a while
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Don't buffer AI streams
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ---- Auth routes — stricter rate-limiting ----
        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://helix_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
        }

        # ---- Static assets — long cache, hard edge ----
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            limit_req zone=static burst=60 nodelay;
            proxy_pass http://helix_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status "STATIC";
            proxy_set_header Host $host;
        }

        # ---- Main application routes (React SPA) ----
        location / {
            proxy_pass http://helix_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_cache_bypass $http_upgrade;

            # Browser caching for HTML — short because SPA shells change with deploys
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }

        # ---- Health check (no rate limit) ----
        location /health {
            access_log off;
            proxy_pass http://helix_backend/health;
            proxy_set_header Host $host;
        }

        location = /api/health {
            access_log off;
            proxy_pass http://helix_backend/api/health;
            proxy_set_header Host $host;
        }

        # ---- Monitoring endpoints — only allow Cloudflare IP ranges + localhost ----
        # Cloudflare already restricts /metrics via WAF rule; we add a second layer here.
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            # Cloudflare public IP ranges (subset)
            allow 173.245.48.0/20;
            allow 103.21.244.0/22;
            allow 103.22.200.0/22;
            allow 103.31.192.0/22;
            allow 141.101.64.0/18;
            allow 108.162.192.0/18;
            allow 190.93.240.0/20;
            allow 188.114.96.0/20;
            allow 197.234.240.0/22;
            allow 198.41.128.0/17;
            allow 162.158.0.0/15;
            allow 104.16.0.0/13;
            allow 104.24.0.0/14;
            allow 172.64.0.0/13;
            allow 131.0.72.0/22;
            deny all;

            proxy_pass http://helix_backend/api/metrics;
            proxy_set_header Host $host;
        }

        # ---- Block common attack patterns ----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* /(wp-admin|wp-login|wp-config|wp-includes|administrator|phpmyadmin|mysqladmin|\.env|\.git) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ----- Grafana monitoring (only reachable via direct Netcup IP, NOT via Cloudflare) -----
    # Cloudflare proxy should be DISABLED (grey cloud) for monitoring.your-domain.com — see CLOUDFLARE-SETUP.md
    server {
        listen 443 ssl;
        http2 on;
        server_name monitoring.deltaways.de;

        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Basic Auth for extra security
        auth_basic "Monitoring Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Only allow LAN / localhost on this vhost
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location / {
            proxy_pass http://grafana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
